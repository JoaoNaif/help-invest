name: help-invest

services:
  postgres:
    image: postgres:16
    container_name: help-invest-postgres
    ports:
      # 5433 no host para não colidir com o Postgres de outros projetos (ex.: ZapWave)
      - '5433:5432'
    environment:
      POSTGRES_USER: helpinvest
      POSTGRES_PASSWORD: helpinvest
      POSTGRES_DB: helpinvest
    volumes:
      - help-invest-pg:/var/lib/postgresql/data

volumes:
  help-invest-pg:
